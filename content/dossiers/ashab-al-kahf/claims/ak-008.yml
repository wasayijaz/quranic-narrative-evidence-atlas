id: ak-008
statement:
  en: "The Tabari passage presents refuge in the cave as the action that follows the youths’ separation from their people."
  ur: "طبری کے اس بیان میں اپنی قوم سے علیحدگی کے بعد غار میں پناہ لینا نوجوانوں کے اگلے عملی قدم کے طور پر سامنے آتا ہے۔"
status: reported-only
source_class: tafsir
independence_group: g-kahf-18-16
