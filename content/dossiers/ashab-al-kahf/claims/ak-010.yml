id: ak-010
statement:
  en: "Al-Tabari’s treatment of Qur’an 18:16 keeps the verse’s command, its grammatical explanation, and its reading discussion together in one passage."
  ur: "طبری کی قرآن 18:16 کی تفسیر میں آیت کا حکم، اس کی نحوی وضاحت اور قراءت کا اختلاف ایک ہی مقام پر ساتھ آتے ہیں۔"
status: reported-only
