id: ak-005
statement:
  en: "To illustrate this grammatical construction, al-Tabari compares it with telling someone: when you sin, seek God’s forgiveness and turn back to Him."
  ur: "اس نحوی ترکیب کی مثال دیتے ہوئے طبری ایسی بات سے تشبیہ دیتے ہیں: جب گناہ ہو جائے تو اللہ سے بخشش مانگو اور اسی کی طرف پلٹو۔"
status: reported-only
source_class: tafsir
independence_group: g-kahf-18-16
