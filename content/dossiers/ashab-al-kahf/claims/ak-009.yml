id: ak-009
statement:
  en: "In the same verse passage, the cave refuge is followed by the promise that God will extend mercy and arrange ease in their affair."
  ur: "اسی آیتی عبارت میں غار کی پناہ کے بعد یہ وعدہ آتا ہے کہ اللہ اپنی رحمت پھیلائے گا اور ان کے معاملے میں آسانی پیدا کرے گا۔"
