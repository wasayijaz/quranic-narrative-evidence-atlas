id: ak-006
statement:
  en: "Al-Tabari records two readings of the word ‘marfiqan’ in Qur’an 18:16 and says that they carry the same meaning."
  ur: "طبری قرآن 18:16 کے لفظ «مَرْفَقًا» کی دو قراءتیں نقل کرتے ہیں اور کہتے ہیں کہ دونوں کا معنی ایک ہے۔"
status: reported-only
