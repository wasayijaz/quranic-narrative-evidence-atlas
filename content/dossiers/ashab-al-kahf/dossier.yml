disclosure:
  en: "Not reviewed by a scholarly board. Compiled by one person with AI assistance from published sources, each cited to edition and page. Where scholars differ, both positions are shown. Corrections welcome — logged publicly."
  ur: "اس مواد کو کسی علمی بورڈ نے نہیں پرکھا۔ اسے ایک شخص نے مصنوعی ذہانت کی مدد سے شائع شدہ ماخذوں سے مرتب کیا ہے، اور ہر ماخذ کو ایڈیشن اور صفحے کے ساتھ درج کیا گیا ہے۔ جہاں اہلِ علم کا اختلاف ہے وہاں دونوں آرا دکھائی جاتی ہیں۔ اصلاحات خوش آئند ہیں اور عوامی طور پر درج کی جاتی ہیں۔"
