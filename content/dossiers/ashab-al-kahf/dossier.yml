description:
  en: "A first reading of the cave narrative, kept close to the page and open about what remains unchecked."
  ur: "غار کی داستان کا پہلا مطالعہ، اصل صفحے کے قریب اور باقی ماندہ جانچ کے بارے میں صاف۔"
reading_depth: adult
